# Deploy to Cloudflare Pages
#
# This workflow is DISABLED by default in the boilerplate.
# To activate it for your site:
#   1. Set the required GitHub repository secrets (see README)
#   2. Uncomment the 'push' trigger below, or use manual dispatch
#
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PROJECT_NAME
# Optional vars:    SITE_URL

name: Deploy to Cloudflare Pages

on:
  # Uncomment the lines below to auto-deploy on push to main:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: "Site config to deploy (e.g. dualmark, isitagentready, or your own)"
        required: true
        default: "dualmark"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Switch site config
        run: node scripts/switch-config.mjs ${{ github.event.inputs.site || 'dualmark' }}

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || '' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
